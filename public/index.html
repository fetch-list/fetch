<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5c3a">
  <title>Fetch!</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/pico.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <span class="brand">Fetch!</span>
    <select id="lists" aria-label="Liste wechseln"></select>
    <details class="menu">
      <summary aria-label="Listenmenü">⋯</summary>
      <div class="menu-items">
        <button type="button" data-act="share">Link zum Teilen kopieren</button>
        <button type="button" data-act="rename">Liste umbenennen</button>
        <a id="export" role="button" download>Als CSV exportieren</a>
        <button type="button" data-act="forget">Liste von diesem Gerät entfernen</button>
      </div>
    </details>
  </header>

  <main>
    <p id="status" role="status"></p>

    <div class="bar">
      <label for="profiles">Sortiert</label>
      <select id="profiles"></select>
      <button type="button" id="clear" class="quiet">Erledigte entfernen</button>
    </div>

    <ul id="items" class="rows"></ul>
    <p id="empty" hidden>Die Liste ist leer. Schreib unten auf, was du brauchst.</p>

    <details id="history" class="section">
      <summary>Zuletzt entfernt</summary>
      <ul class="rows"></ul>
    </details>

    <details id="bundles" class="section">
      <summary>Bundles</summary>
      <ul class="rows"></ul>
      <button type="button" id="save-bundle" class="quiet">Aktuelle Liste als Bundle speichern</button>
    </details>
  </main>

  <form id="add" class="addbar" autocomplete="off">
    <input name="name" placeholder="z. B. 2 Quark" aria-label="Neuer Eintrag" list="suggest" enterkeyhint="done" required>
    <datalist id="suggest"></datalist>
    <button type="submit" aria-label="Hinzufügen">+</button>
  </form>

  <script src="vendor/sortable.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
